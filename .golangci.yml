version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
    - bodyclose
    - noctx
  settings:
    gosec:
      excludes:
        - G304 # file paths come from the operator's own config and state dir
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
