name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Lint (go vet, go mod tidy -diff, golangci-lint)
        run: go tool task lint
      - name: Test (race detector)
        run: go test -count=1 -race -timeout 10m ./...
      - name: Build static binary
        run: go tool task build:linux-amd64
